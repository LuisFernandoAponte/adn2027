# PostgREST configuration for ADN Motors
# =======================================
# Save as: postgrest.conf
# Run: postgrest postgrest.conf

db-uri       = "postgresql://postgres:Fernanditofan4@localhost:5432/adnmotors"
db-schema    = "public"
db-anon-role = "postgres"

server-port  = 3000

# JWT secret (must match microservice)
jwt-secret   = "adn_motors_secret_key_2024_change_in_production"

# CORS
server-cors-allowed-origins = "http://localhost:5173,http://localhost:8080,http://localhost:3001"

# Rate limit
server-rate-limit-raw-requests = 100

# Max rows per request
db-max-rows = 1000

# Root spec
openapi-mode = "ignore-privileges"

# Admin role (bypasses RLS)
db-pre-request = "SET app.user_id = current_setting('request.jwt.claims', true)::json->>'userId'"
